<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 520" width="1280" height="520" role="img" aria-label="Dexterity Connect: your office, connected. No internet required.">
  <defs>
    <pattern id="g" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1c4a50" stroke-width="1" opacity=".55"/>
    </pattern>
    <pattern id="gf" width="8" height="8" patternUnits="userSpaceOnUse">
      <path d="M8 0H0V8" fill="none" stroke="#10292d" stroke-width=".6"/>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="46%" r="55%">
      <stop offset="0" stop-color="#16424a" stop-opacity=".9"/>
      <stop offset="1" stop-color="#071315" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3aa3ae"/><stop offset=".55" stop-color="#1c7680"/><stop offset="1" stop-color="#123a3f"/>
    </linearGradient>
    <radialGradient id="spark" cx="40%" cy="35%" r="70%">
      <stop offset="0" stop-color="#ffd38a"/><stop offset=".6" stop-color="#f7af44"/><stop offset="1" stop-color="#e8921e"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
    <style>
      .link { fill: none; stroke: #4fb3bf; stroke-width: 1.4; stroke-dasharray: 520; stroke-dashoffset: 520; opacity: .85; animation: draw 2.4s cubic-bezier(.2,.8,.2,1) forwards; }
      .pc { opacity: 0; animation: rise .8s cubic-bezier(.2,.8,.2,1) forwards; }
      .pc rect.scr { fill: #2a8c98; animation: blink 4s ease-in-out infinite; }
      .title { font: 700 58px 'Outfit', 'Segoe UI', system-ui, sans-serif; fill: #e8f2f3; letter-spacing: -1.5px; }
      .tag { font: 400 21px 'Segoe UI', system-ui, sans-serif; fill: #a9c3c6; }
      .label { font: 600 13px 'Segoe UI', system-ui, sans-serif; fill: #8fd8e0; letter-spacing: 3px; }
      .ring { fill: none; stroke: #4fb3bf; stroke-width: 2; opacity: .8; transform-origin: 640px 250px; animation: breathe 3.2s ease-in-out infinite; }
      .halo { fill: none; stroke: #f7af44; stroke-width: 2; opacity: 0; transform-origin: 640px 250px; animation: ping 3.2s ease-out infinite; }
      @keyframes draw { to { stroke-dashoffset: 0; } }
      @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
      @keyframes blink { 0%, 100% { opacity: .75; } 50% { opacity: 1; } }
      @keyframes breathe { 50% { transform: scale(1.03); } }
      @keyframes ping { 0% { opacity: .7; transform: scale(.7); } 100% { opacity: 0; transform: scale(1.5); } }
    </style>
  </defs>

  <rect width="1280" height="520" fill="#071315"/>
  <rect width="1280" height="520" fill="url(#gf)"/>
  <rect width="1280" height="520" fill="url(#g)"/>
  <rect width="1280" height="520" fill="url(#glow)"/>

  <!-- links from the hub to every workstation -->
  <g>
    <path id="l1" class="link" d="M640 250 Q 470 160 300 130" style="animation-delay:.2s"/>
    <path id="l2" class="link" d="M640 250 Q 430 250 210 260" style="animation-delay:.35s"/>
    <path id="l3" class="link" d="M640 250 Q 470 350 320 400" style="animation-delay:.5s"/>
    <path id="l4" class="link" d="M640 250 Q 810 160 980 130" style="animation-delay:.25s"/>
    <path id="l5" class="link" d="M640 250 Q 850 250 1070 260" style="animation-delay:.4s"/>
    <path id="l6" class="link" d="M640 250 Q 810 350 960 400" style="animation-delay:.55s"/>
  </g>

  <!-- workstations -->
  <g fill="#1a3236">
    <g class="pc" style="animation-delay:.9s"><rect class="scr" x="270" y="104" width="60" height="38" rx="4"/><rect x="297" y="142" width="6" height="16"/><rect x="284" y="157" width="32" height="4" rx="2"/></g>
    <g class="pc" style="animation-delay:1s"><rect class="scr" x="180" y="234" width="60" height="38" rx="4"/><rect x="207" y="272" width="6" height="16"/><rect x="194" y="287" width="32" height="4" rx="2"/></g>
    <g class="pc" style="animation-delay:1.1s"><rect class="scr" x="290" y="374" width="60" height="38" rx="4"/><rect x="317" y="412" width="6" height="16"/><rect x="304" y="427" width="32" height="4" rx="2"/></g>
    <g class="pc" style="animation-delay:.95s"><rect class="scr" x="950" y="104" width="60" height="38" rx="4"/><rect x="977" y="142" width="6" height="16"/><rect x="964" y="157" width="32" height="4" rx="2"/></g>
    <g class="pc" style="animation-delay:1.05s"><rect class="scr" x="1040" y="234" width="60" height="38" rx="4"/><rect x="1067" y="272" width="6" height="16"/><rect x="1054" y="287" width="32" height="4" rx="2"/></g>
    <g class="pc" style="animation-delay:1.15s"><rect x="944" y="372" width="30" height="52" rx="6" fill="#1a3236"/><rect class="scr" x="948" y="378" width="22" height="40" rx="3"/></g>
  </g>

  <!-- messages travelling over the LAN -->
  <g>
    <circle r="5" fill="#f7af44"><animateMotion dur="2.6s" begin="2s" repeatCount="indefinite"><mpath href="#l1"/></animateMotion></circle>
    <circle r="4" fill="#ffffff"><animateMotion dur="3.1s" begin="2.4s" repeatCount="indefinite" keyPoints="1;0" keyTimes="0;1" calcMode="linear"><mpath href="#l2"/></animateMotion></circle>
    <circle r="5" fill="#f7af44"><animateMotion dur="2.2s" begin="2.8s" repeatCount="indefinite"><mpath href="#l3"/></animateMotion></circle>
    <circle r="5" fill="#f7af44"><animateMotion dur="2.9s" begin="2.2s" repeatCount="indefinite" keyPoints="1;0" keyTimes="0;1" calcMode="linear"><mpath href="#l4"/></animateMotion></circle>
    <circle r="4" fill="#ffffff"><animateMotion dur="2.4s" begin="2.6s" repeatCount="indefinite"><mpath href="#l5"/></animateMotion></circle>
    <circle r="5" fill="#f7af44"><animateMotion dur="3.3s" begin="3s" repeatCount="indefinite" keyPoints="1;0" keyTimes="0;1" calcMode="linear"><mpath href="#l6"/></animateMotion></circle>
  </g>

  <!-- the hub -->
  <ellipse cx="640" cy="318" rx="120" ry="22" fill="#0b1d20" stroke="#4fb3bf" stroke-opacity=".5"/>
  <circle class="halo" cx="640" cy="250" r="96"/>
  <circle class="ring" cx="640" cy="250" r="96"/>
  <circle cx="640" cy="250" r="70" fill="#0f2a2e" filter="url(#soft)" opacity=".9"/>
  <g transform="translate(580 190) scale(.234)">
    <rect x="32" y="32" width="448" height="448" rx="116" fill="url(#tile)"/>
    <path fill="#ffffff" fill-rule="evenodd" d="M150 120 H274 C356 120 410 178 410 256 C410 334 356 392 274 392 H214 L150 436 Z M210 180 V332 H272 C319 332 350 300 350 256 C350 212 319 180 272 180 Z"/>
    <circle cx="272" cy="256" r="38" fill="url(#spark)">
      <animate attributeName="r" values="34;42;34" dur="2.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <text x="640" y="400" text-anchor="middle" class="label">DEXTERITY DESIGN SERVICES · INTERNAL</text>
  <text x="640" y="452" text-anchor="middle" class="title">Dexterity Connect</text>
  <text x="640" y="490" text-anchor="middle" class="tag">Your office, connected. No internet required.</text>
</svg>
